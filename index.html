<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Камера" />
  <title>Камера: запись с нужным соотношением сторон</title>

  <!-- PWA: подключение манифеста -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 20px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    button,
    select,
    input,
    a,
    label.checkbox-label {
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.45;
    }

    #startCamera {
      background: #2f6fed;
      color: white;
    }

    #startRec {
      background: #d23f3f;
      color: white;
    }

    #stopRec {
      background: #666;
      color: white;
    }

    #download {
      background: #2ea043;
      color: white;
      text-decoration: none;
    }

    #status {
      margin: 10px 0;
      min-height: 20px;
      color: #ffd75e;
      white-space: pre-wrap;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      min-height: 200px;
    }

    #preview {
      background: #000;
      border-radius: 12px;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    .checkbox-label {
      background: #333;
      color: #eee;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 16px;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .stabilization-status {
      font-size: 14px;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <h2>Запись видео с заданным соотношением сторон</h2>

  <div class="row">
    <label for="ratio">Соотношение сторон:</label>

    <select id="ratio">
      <!-- Горизонтальные киноформаты -->
      <option value="1:1">1:1 / Квадрат</option>
      <option value="1.37:1">1.37:1 / Академический</option>
      <option value="1.66:1">1.66:1 / Европейский</option>
      <option value="1.85:1" selected>1.85:1 / US widescreen</option>
      <option value="2.20:1">2.20:1 / 70mm</option>
      <option value="2.39:1">2.39:1 / Scope</option>

      <!-- Вертикальный формат для смартфона -->
      <option value="9:16">9:16 / Вертикальный (смартфон)</option>

      <option value="custom">Своё соотношение</option>
    </select>

    <input
      id="customRatio"
      placeholder="Например 1.85:1"
      style="display: none; min-width: 220px;"
    />
  </div>

  <div class="row">
    <button id="startCamera">Включить камеру</button>
    <button id="startRec" disabled>Начать запись</button>
    <button id="stopRec" disabled>Остановить</button>
    <a id="download" style="display: none;">Скачать видео</a>
  </div>

  <div class="row">
    <label class="checkbox-label">
      <input type="checkbox" id="stabilizationCheckbox" checked />
      Стабилизация видео
    </label>
  </div>

  <div class="stabilization-status" id="stabilizationStatus"></div>

  <div id="status"></div>

  <div class="canvas-wrapper">
    <canvas id="preview"></canvas>
  </div>

  <video id="camera" playsinline muted style="display: none;"></video>

  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d', { alpha: false });
    const canvasWrapper = document.querySelector('.canvas-wrapper');

    const ratioSelect = document.getElementById('ratio');
    const customRatioInput = document.getElementById('customRatio');

    const startCameraBtn = document.getElementById('startCamera');
    const startRecBtn = document.getElementById('startRec');
    const stopRecBtn = document.getElementById('stopRec');
    const downloadLink = document.getElementById('download');
    const statusEl = document.getElementById('status');

    const stabilizationCheckbox = document.getElementById('stabilizationCheckbox');
    const stabilizationStatusEl = document.getElementById('stabilizationStatus');

    let cameraStream = null;
    let rafId = null;
    let mediaRecorder = null;
    let chunks = [];
    let stabilizationApplied = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setStabilizationStatus(text, isError = false) {
      stabilizationStatusEl.textContent = text;
      stabilizationStatusEl.style.color = isError ? '#ff6b6b' : '#6bff6b';
    }

    // Проверка при загрузке страницы
    window.addEventListener('load', () => {
      const problems = [];

      if (!window.isSecureContext) {
        problems.push('страница должна быть открыта по HTTPS или через localhost');
      }

      const supportsCamera = !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      );

      if (!supportsCamera) {
        problems.push('браузер не поддерживает доступ к камере через getUserMedia');
      }

      if (problems.length > 0) {
        setStatus('Ошибка: ' + problems.join('; ') + '.');
        startCameraBtn.disabled = true;
      } else {
        setStatus('Страница готова. Нажмите «Включить камеру».');
      }
    });

    /**
     * Понимает:
     * "1:1"
     * "1.85:1"
     * "1:1.85"
     * "9:16"
     * "2.39"
     */
    function parseRatio(str) {
      if (!str) return 1;

      str = String(str).trim().replace(',', '.');

      if (str.includes(':')) {
        const parts = str.split(':');
        const w = parseFloat(parts[0]);
        const h = parseFloat(parts[1]);

        if (Number.isFinite(w) && Number.isFinite(h) && h > 0) {
          return w / h;
        }
      }

      const n = parseFloat(str);
      return Number.isFinite(n) && n > 0 ? n : 1;
    }

    function getAspect() {
      if (ratioSelect.value === 'custom') {
        return parseRatio(customRatioInput.value || '1:1');
      }

      return parseRatio(ratioSelect.value);
    }

    function even(value) {
      return Math.max(2, Math.round(value / 2) * 2);
    }

    /**
     * Пытается включить стабилизацию видео через applyConstraints.
     * Это нестандартный способ, и он может не работать на всех устройствах.
     */
    async function tryEnableStabilization(track) {
      if (!stabilizationCheckbox.checked) {
        setStabilizationStatus('Стабилизация выключена пользователем.', false);
        return false;
      }

      const constraintsVariants = [
        // Вариант 1: стандартное свойство (если поддерживается)
        { videoStabilization: true },
        // Вариант 2: через advanced (для некоторых браузеров)
        { advanced: [{ videoStabilization: true }] },
        // Вариант 3: альтернативное имя (для некоторых устройств)
        { stabilization: true },
        // Вариант 4: через focusMode и другие связанные свойства
        { focusMode: 'continuous-video' }
      ];

      for (const constraints of constraintsVariants) {
        try {
          await track.applyConstraints(constraints);
          setStabilizationStatus('Стабилизация включена (аппаратная или программная).', false);
          return true;
        } catch (err) {
          console.warn('Не удалось применить ограничения стабилизации:', constraints, err);
        }
      }

      setStabilizationStatus(
        'Стабилизация недоступна в браузере. Попробуйте нативное приложение для полной стабилизации.',
        true
      );
      return false;
    }

    function computeLayout() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (!vw || !vh) return null;

      const targetAspect = getAspect();
      const sourceAspect = vw / vh;

      let cropW;
      let cropH;

      if (sourceAspect > targetAspect) {
        cropH = vh;
        cropW = vh * targetAspect;
      } else {
        cropW = vw;
        cropH = vw / targetAspect;
      }

      cropW = Math.min(cropW, vw);
      cropH = Math.min(cropH, vh);

      const sx = (vw - cropW) / 2;
      const sy = (vh - cropH) / 2;

      const maxSide = 1920;

      let outW;
      let outH;

      if (targetAspect >= 1) {
        outH = Math.min(cropH, 1080);
        outW = outH * targetAspect;

        if (outW > maxSide) {
          outW = maxSide;
          outH = outW / targetAspect;
        }
      } else {
        outW = Math.min(cropW, 1080);
        outH = outW / targetAspect;

        if (outH > maxSide) {
          outH = maxSide;
          outW = outH * targetAspect;
        }
      }

      outW = even(outW);
      outH = even(outH);

      if (outW < 2 || outH < 2) return null;

      return {
        sx,
        sy,
        cropW,
        cropH,
        outW,
        outH,
        targetAspect
      };
    }

    function fitCanvasToScreen() {
      if (!canvas.width || !canvas.height) return;

      const maxWidth = canvasWrapper.clientWidth;
      const maxHeight = canvasWrapper.clientHeight;

      if (maxWidth <= 0 || maxHeight <= 0) return;

      const aspect = canvas.width / canvas.height;

      let cssWidth = maxWidth;
      let cssHeight = cssWidth / aspect;

      if (cssHeight > maxHeight) {
        cssHeight = maxHeight;
        cssWidth = cssHeight * aspect;
      }

      canvas.style.width = Math.floor(cssWidth) + 'px';
      canvas.style.height = Math.floor(cssHeight) + 'px';
    }

    function drawLoop() {
      if (video.readyState >= 2) {
        const layout = computeLayout();

        if (layout) {
          if (canvas.width !== layout.outW || canvas.height !== layout.outH) {
            canvas.width = layout.outW;
            canvas.height = layout.outH;
            fitCanvasToScreen();
          }

          ctx.drawImage(
            video,
            layout.sx,
            layout.sy,
            layout.cropW,
            layout.cropH,
            0,
            0,
            canvas.width,
            canvas.height
          );
        }
      }

      rafId = requestAnimationFrame(drawLoop);
    }

    ratioSelect.addEventListener('change', () => {
      customRatioInput.style.display =
        ratioSelect.value === 'custom' ? '' : 'none';
    });

    window.addEventListener('resize', fitCanvasToScreen);
    window.addEventListener('orientationchange', () => {
      setTimeout(fitCanvasToScreen, 100);
    });

    async function getCameraStream() {
      const videoConstraints = {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      };

      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: videoConstraints
        });
      } catch (err) {
        console.warn('Не получилось с аудио, пробуем без него', err);
      }

      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: videoConstraints
        });
      } catch (err) {
        console.warn('Не получилось с заданным разрешением, пробуем базовое видео', err);
      }

      return await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: true
      });
    }

    startCameraBtn.addEventListener('click', async () => {
      try {
        stopCamera();

        setStatus('Запрашиваю камеру и микрофон...');

        cameraStream = await getCameraStream();

        video.srcObject = cameraStream;
        await video.play();

        startRecBtn.disabled = false;

        const hasAudio = cameraStream.getAudioTracks().length > 0;

        setStatus(
          `Камера готова. ${hasAudio ? 'Звук включён.' : 'Звук недоступен.'} ` +
          'Выберите соотношение и нажмите «Начать запись».'
        );

        // Пытаемся включить стабилизацию
        const videoTrack = cameraStream.getVideoTracks()[0];
        if (videoTrack) {
          stabilizationApplied = await tryEnableStabilization(videoTrack);
        }

        if (!rafId) {
          drawLoop();
        }
      } catch (err) {
        console.error(err);
        setStatus('Ошибка доступа к камере: ' + err.message);
      }
    });

    function stopCamera() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
        } catch (e) {
          console.warn(e);
        }
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      startRecBtn.disabled = true;
      stopRecBtn.disabled = true;
      ratioSelect.disabled = false;
      customRatioInput.disabled = false;
      stabilizationApplied = false;
    }

    function pickMimeType() {
      if (typeof MediaRecorder === 'undefined') return '';

      if (typeof MediaRecorder.isTypeSupported !== 'function') {
        return '';
      }

      const candidates = [
        'video/mp4;codecs=avc1.640028,mp4a.40.2',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];

      for (const type of candidates) {
        try {
          if (MediaRecorder.isTypeSupported(type)) {
            return type;
          }
        } catch (e) {
          // ignore
        }
      }

      return '';
    }

    startRecBtn.addEventListener('click', () => {
      if (!cameraStream) {
        setStatus('Сначала включите камеру.');
        return;
      }

      if (!canvas.width || !canvas.height) {
        setStatus('Подождите, пока появится изображение с камеры.');
        return;
      }

      if (typeof canvas.captureStream !== 'function') {
        setStatus('Этот браузер не поддерживает canvas.captureStream().');
        return;
      }

      if (typeof MediaRecorder === 'undefined') {
        setStatus('Этот браузер не поддерживает MediaRecorder.');
        return;
      }

      const canvasStream = canvas.captureStream(30);

      const mixedTracks = [
        ...canvasStream.getVideoTracks(),
        ...cameraStream.getAudioTracks()
      ];

      const mixedStream = new MediaStream(mixedTracks);

      const mimeType = pickMimeType();

      const options = {
        videoBitsPerSecond: 8_000_000
      };

      if (mimeType) {
        options.mimeType = mimeType;
      }

      try {
        mediaRecorder = new MediaRecorder(mixedStream, options);
      } catch (err) {
        console.warn('Не удалось создать MediaRecorder с MIME type, пробую без него', err);
        mediaRecorder = new MediaRecorder(mixedStream);
      }

      chunks = [];

      mediaRecorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      mediaRecorder.onstop = saveVideo;

      mediaRecorder.start(1000);

      startRecBtn.disabled = true;
      stopRecBtn.disabled = false;
      ratioSelect.disabled = true;
      customRatioInput.disabled = true;

      const stabText = stabilizationApplied ? 'Стабилизация активна.' : 'Стабилизация недоступна.';

      setStatus(
        `Идёт запись... Формат: ${mediaRecorder.mimeType || 'по умолчанию'}. ` +
        stabText + ' ' +
        'Соотношение во время записи лучше не менять.'
      );
    });

    stopRecBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      stopRecBtn.disabled = true;
    });

    function saveVideo() {
      const mimeType =
        mediaRecorder && mediaRecorder.mimeType
          ? mediaRecorder.mimeType
          : 'video/webm';

      const blob = new Blob(chunks, { type: mimeType });

      const url = URL.createObjectURL(blob);
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';

      const ratioNameRaw =
        ratioSelect.value === 'custom'
          ? customRatioInput.value || 'custom'
          : ratioSelect.value;

      const ratioName = ratioNameRaw.replace(/[:.]/g, '_');

      const dateStamp = new Date()
        .toISOString()
        .replace(/[:.]/g, '-');

      downloadLink.href = url;
      downloadLink.download = `video_${ratioName}_${dateStamp}.${ext}`;
      downloadLink.style.display = 'inline-block';
      downloadLink.textContent = 'Скачать видео';

      startRecBtn.disabled = false;
      ratioSelect.disabled = false;
      customRatioInput.disabled = false;

      setStatus('Готово. Можно скачать файл.');
    }

    window.addEventListener('beforeunload', () => {
      stopCamera();
    });

    // PWA: Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/camera-aspect/sw.js')
          .then(registration => {
            console.log('Service Worker зарегистрирован:', registration.scope);
          })
          .catch(error => {
            console.error('Ошибка регистрации Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
